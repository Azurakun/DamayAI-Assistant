<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DamayAI - Asisten Cerdas SMKN 2 Indramayu</title>
    <meta name="description" content="DamayAI adalah asisten virtual berbasis AI untuk SMKN 2 Indramayu. Tanyakan informasi seputar sekolah.">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.png" type="image/png">

    <script>
        // Apply saved theme immediately to prevent flash of wrong theme
        (function() {
            var t = localStorage.getItem('damayai-user-theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body>

    <div id="app-container">

        <header>
            <div style="display:flex;align-items:center;gap:0.75rem;">
                <img src="favicon.png" alt="Logo" style="height:2.5rem;width:2.5rem;border-radius:9999px;border:2px solid var(--user-accent);padding:2px;">
                <div>
                    <h1 style="font-size:0.9rem;font-weight:700;color:var(--user-text-primary);margin:0;line-height:1.2;">Asisten AI <br class="sm-hide"> SMKN 2 Indramayu</h1>
                    <p style="font-size:0.65rem;font-weight:600;color:#16a34a;display:flex;align-items:center;gap:0.375rem;margin:0.125rem 0 0;">
                        <span class="online-dot">
                          <span class="online-dot-ping"></span>
                          <span class="online-dot-solid"></span>
                        </span>
                        Online
                    </p>
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:0.5rem;">
                <button id="theme-toggle-user" class="user-theme-toggle" title="Ubah Tema">
                    <i class="fas fa-moon" id="user-theme-icon"></i>
                </button>
                <button id="bug-report-btn" class="header-btn header-btn-bug">
                    <i class="fas fa-bug"></i><span class="btn-text">Lapor Bug</span>
                </button>
                <button id="new-chat-btn" class="header-btn header-btn-new">
                    <i class="fas fa-plus-circle"></i><span class="btn-text">Baru</span>
                </button>
            </div>
        </header>

        <main id="chat-area">
            <div id="chat-container"></div>
        </main>

        <footer>
            <div class="footer-inner">
                <form id="chat-form" class="chat-form">
                    <div style="position:relative;flex:1;">
                        <input type="text" id="chat-input" placeholder="Tanya seputar sekolah..." autocomplete="off" required>
                        <button type="submit" id="send-btn">
                            <i class="fas fa-arrow-up" style="font-size:0.8rem;"></i>
                        </button>
                    </div>
                </form>
                <p class="disclaimer">AI dapat membuat kesalahan. Cek kembali informasi penting.</p>
            </div>
        </footer>

    </div>

    <div id="bug-report-modal" style="display:none;">
        <div class="bug-modal-card">
            <div class="bug-modal-header">
                <h2>Laporkan Bug</h2>
                <button id="close-bug-report-modal-btn" class="bug-modal-close">&times;</button>
            </div>
            <div class="bug-modal-body">
                <form id="bug-report-form">
                    <div style="margin-bottom:1rem;">
                        <label for="bug-description" class="bug-form-label">Jelaskan masalahnya</label>
                        <textarea id="bug-description" name="description" rows="4" class="bug-form-textarea" placeholder="Contoh: Jawaban AI terpotong saat..." required></textarea>
                    </div>
                    <div style="margin-bottom:1.25rem;">
                        <label for="bug-file" class="bug-form-label">Lampiran (Opsional)</label>
                        <input type="file" id="bug-file" accept="image/*,video/*" style="width:100%;font-size:0.75rem;color:var(--user-text-muted);">
                    </div>
                    <div style="display:flex;justify-content:flex-end;">
                        <button type="submit" id="submit-bug-report-btn" class="bug-submit-btn">Kirim</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
