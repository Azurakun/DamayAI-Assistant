<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Bank — DamayAI Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
    <link rel="icon" href="favicon.png" type="image/png">
    <script>
        (function() {
            var t = localStorage.getItem('damayai-admin-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body>
    <div id="auth-overlay" style="position:fixed;inset:0;background:var(--bg-overlay);display:flex;align-items:center;justify-content:center;z-index:100;">
        <div style="background:var(--bg-card);border:1px solid var(--border-card);padding:2.5rem;border-radius:1.25rem;text-align:center;max-width:380px;width:90%;backdrop-filter:var(--glass-blur);box-shadow:var(--card-shadow);">
            <div style="margin-bottom:1.5rem;">
                <i class="fas fa-shield-halved" style="font-size:2.5rem;color:var(--text-accent);margin-bottom:0.75rem;display:block;"></i>
                <h2 style="margin:0;font-size:1.5rem;font-weight:700;color:var(--text-primary);">Akses Admin</h2>
                <p style="margin:0.5rem 0 0;font-size:0.9rem;color:var(--text-muted);">Masukkan sandi untuk melanjutkan.</p>
            </div>
            <input type="password" id="admin-code" class="form-input" style="text-align:center;letter-spacing:0.2em;font-size:1.1rem;padding:1rem;" placeholder="••••••" autocomplete="current-password">
            <p id="error-msg" style="color:#ef4444;margin:0.75rem 0 0;min-height:1.25rem;font-size:0.85rem;font-weight:500;"></p>
        </div>
    </div>

    <!-- Mobile Header -->
    <div class="mobile-header">
        <button class="hamburger-btn" id="hamburger-btn"><i class="fas fa-bars"></i></button>
        <h1>DamayAI</h1>
    </div>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div id="admin-panel" class="admin-layout" style="display:none;">
        <aside class="admin-sidebar" id="admin-sidebar">
            <div class="sidebar-header">
                <h1>DamayAI</h1>
                <p>Panel Administrasi</p>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section-label">Menu Utama</div>
                <a href="admin.html" class="nav-item"><span class="nav-icon"><i class="fas fa-gauge-high"></i></span>Dashboard</a>
                <a href="admin-add-data.html" class="nav-item"><span class="nav-icon"><i class="fas fa-file-circle-plus"></i></span>Tambah Data</a>
                <a href="admin-data-bank.html" class="nav-item active"><span class="nav-icon"><i class="fas fa-database"></i></span>Data Bank</a>
                <a href="admin-bugs.html" class="nav-item"><span class="nav-icon"><i class="fas fa-bug"></i></span>Laporan Bug</a>
                <a href="admin-ai.html" class="nav-item"><span class="nav-icon"><i class="fas fa-robot"></i></span>Uji Coba AI</a>
                <div class="nav-section-label" style="margin-top:0.75rem;">Sistem</div>
                <a href="admin-settings.html" class="nav-item"><span class="nav-icon"><i class="fas fa-gear"></i></span>Pengaturan</a>
            </nav>
            <div class="sidebar-footer">
                <button class="theme-toggle-btn" id="theme-toggle-btn"><span class="theme-icon" id="theme-icon"><i class="fas fa-moon"></i></span><span id="theme-label">Tema</span></button>
                <button class="theme-toggle-btn" id="logout-btn" style="flex:0;padding:0.65rem 0.8rem;" title="Logout"><i class="fas fa-right-from-bracket"></i></button>
            </div>
        </aside>

        <main class="admin-main">
            <h2 class="page-title">Data Bank</h2>
            <p class="page-subtitle">Pusat kelola seluruh data konteks yang telah diinputkan atau discraping.</p>

            <div class="admin-card">
                <div class="filter-bar" id="data-filter-container">
                    <button class="filter-chip active" data-filter="Semua">Semua Tipe Data</button>
                    <button class="filter-chip" data-filter="Scrap">Website Crawled</button>
                    <button class="filter-chip" data-filter="Manual">Manual Upload</button>
                    <button class="filter-chip" data-filter="Memory">Memory Chat</button>
                </div>
                <div style="margin-bottom:1.5rem;">
                    <input type="search" id="search-data-input" class="form-input" placeholder="🔍 Cari berdasarkan judul atau detail konten..." style="border-radius:2rem;padding-left:1.5rem;">
                </div>
                <div id="data-list-content">
                    <p style="color:var(--text-muted);font-weight:500;">Memuat bank data...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- DATA MODAL -->
    <div id="data-modal" class="modal-backdrop" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Detail</h2>
                <button id="close-modal-btn" class="modal-close"><i class="fas fa-times"></i></button>
            </div>
            <div id="modal-content-edit" class="modal-body" style="display:none;"></div>
            <div id="modal-content-detail" class="modal-body" style="display:none;"></div>
            <div id="modal-content-bug-detail" class="modal-body" style="display:none;"></div>
        </div>
    </div>
    
    <script src="admin.js"></script>
</body>
</html>
